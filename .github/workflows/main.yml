name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Keep Network Level Authentication enabled.
          Set-ItemProperty -Path $rdpPath `
            -Name 'UserAuthentication' -Value 1 -Force

          # Remove any previous rule with the same name.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Restrict inbound RDP to Tailscale IPv4 addresses.
          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in repository Actions secrets."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
            New-LocalUser `
              -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP')) {
            throw "RDP user creation failed."
          }

          Write-Host "RDP user created."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList @(
              '/i',
              $installerPath,
              '/quiet',
              '/norestart'
            ) `
            -Wait -PassThru

          Remove-Item $installerPath -Force `
            -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Add TAILSCALE_AUTH_KEY in repository Actions secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable was not found."
          }

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-${{ github.run_id }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $candidate = (& $ts ip -4 | Select-Object -First 1)

            if ($candidate -and
                $candidate.Trim() -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
              $tsIP = $candidate.Trim()
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale connected."

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful."

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: use your RDP_PASSWORD secret."
          Write-Host "=================="

          while ($true) {
            Write-Host "[$(Get-Date)] Runner active."
            Start-Sleep -Seconds 300
          }
